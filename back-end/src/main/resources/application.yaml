spring:
  application:
    name: barberapp-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    expiration: ${JWT_EXPIRATION:86400000}
    key: ${JWT_KEY}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_EMAIL}
    password: ${SENHA_DE_APP}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

admin:
  email: ${ADMIN_EMAIL}
  senha: ${ADMIN_SENHA}
  nome: ${ADMIN_NOME}

gemini:
  api_key: ${API_KEY}
  url: ${URL_GEMINI}