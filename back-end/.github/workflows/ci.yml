name: Java CI/CD (BarberApp)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compila o projeto pulando os testes que dependem de banco real no GitHub
      - name: Compilar com Maven
        run: mvn clean install -DskipTests

  deploy-docker:
    # Esta linha garante que o CD só roda se os testes do Java passarem antes
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      # Conecta o robô do GitHub na sua conta do Docker Hub usando as senhas salvas
      - name: Logar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ DOCKERHUB_USERNAME }}
          password: ${{ DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gera o build do seu Dockerfile e envia para a nuvem automaticamente
      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/barberapp-backend:latest
