name: Java CI (BarberApp)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar os testes unitários do Back-end
        working-directory: ./back-end
        env:
          TZ: "America/Sao_Paulo"
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 25
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.h2.Driver
          LANGCHAIN4J_GOOGLE_AI_GEMINI_API_KEY: "mocked-api-key-for-test-purposes"
          LANGCHAIN4J_GOOGLE_AI_GEMINI_MODEL_NAME: "gemini-1.5-flash"
        run: mvn -B clean verify
